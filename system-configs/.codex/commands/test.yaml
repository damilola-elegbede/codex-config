name: test
description: >
  Plan and execute validation steps before merging or releasing changes.
personas:
  - test-engineer
  - ops-responder
skills:
  - testing-strategy
  - ci-debugging
  - release-operations
inputs:
  - key: scope
    prompt: "Describe the feature, bugfix, or area under test"
    required: true
  - key: risk
    prompt: "Known risks, constraints, or deadlines"
    required: false
pre_run:
  - "Identify recent flaky tests and open incidents."
  - "Confirm CI pipeline status and queued runs."
post_run:
  - "Record test results and sign-off in release notes."
context:
  include:
    - tests/
    - docs/REFERENCE.md
