name: docs
description: >
  Refresh product and engineering documentation for upcoming releases.
personas:
  - docs-champion
  - ux-researcher
skills:
  - markdown-polish
  - documentation-style
  - user-research-synthesis
inputs:
  - key: deliverable
    prompt: "Doc type or deliverable (guide, reference, changelog, etc.)"
    required: true
  - key: audience
    prompt: "Primary reader profile"
    required: false
pre_run:
  - "Audit existing docs for stale sections."
  - "Gather latest product decisions and research findings."
post_run:
  - "Publish docs and announce updates in release notes."
context:
  include:
    - docs/
