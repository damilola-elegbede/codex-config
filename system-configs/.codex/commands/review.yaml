name: review
description: >
  Provide a structured code review covering architecture, quality, and documentation.
personas:
  - backend-architect
  - docs-champion
  - security-analyst
skills:
  - api-design
  - testing-strategy
  - markdown-polish
  - security-audit
inputs:
  - key: changeset
    prompt: "Link to branch, PR, or commit range under review"
    required: true
  - key: focus
    prompt: "Areas of concern (performance, security, UX, etc.)"
    required: false
pre_run:
  - "Fetch latest commits and ensure linters/tests have been run."
  - "Identify documentation updates required by the change."
post_run:
  - "Capture action items and share in the review thread."
context:
  include:
    - docs/REFERENCE.md
