name: sync
description: >
  Deploy Codex configuration to ~/.codex with validation and backup.
personas:
  - project-orchestrator
  - ops-responder
skills:
  - release-operations
  - git-workflow-rescue
inputs:
  - key: dry_run
    prompt: "Preview without copying files"
    required: false
  - key: backup
    prompt: "Create backup before syncing"
    required: false
pre_run:
  - "Run validation to ensure configs are consistent."
post_run:
  - "Confirm ~/.codex contents and backup location."
